name: refresh stats

# Daily refresh of the star / fork numbers behind dashboard.svg.
#
# `generate.py` rewrites the SVG on every single run (the freshness term decays
# with the calendar and the header carries today's date), so `git status` can
# never tell "nothing happened" from "another day went by". The commit decision
# therefore comes from scripts/refresh_stats.py: it compares the freshly fetched
# stars / forks / watchers / language / pushed date / description against the
# committed snapshot in data/stats.json. Same numbers -> no commit at all.
#
# The daily snapshot is also the only place the raw numbers live in git, so
# `git log data/stats.json` is a readable star history (checkout keeps full
# history for exactly that).
#
# GitHub occasionally rejects a legitimate push with a server-side hiccup
# (`remote: fatal error in commit_refs_rules`) or because a human pushed while
# the job ran. Neither is a code bug, so the push is retried after a rebase that
# prefers the freshly regenerated files.

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC = 11:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: "数据没变也提交一次（只用来验证流程）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    # never push from a fork
    if: github.repository == 'Weidows/Weidows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history so `git log data/stats.json` reads, and retries can rebase

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install font subsetting deps
        # brand font is subset by generate.py via fontTools; woff2 needs brotli
        run: python -m pip install --quiet -r requirements.txt

      - name: Fetch live data and regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py --refresh

      - name: Compare stats with the committed snapshot
        id: gate
        run: python scripts/refresh_stats.py

      - name: Discard the regenerated files (nothing moved)
        if: steps.gate.outputs.changed != 'true' && inputs.force != true
        run: |
          git checkout -- .
          echo "no data change — skipped commit"

      - name: Sync profile README from dashboard.md
        if: steps.gate.outputs.changed == 'true' || inputs.force == true
        run: cp dashboard.md README.md

      - name: Commit and push
        if: steps.gate.outputs.changed == 'true' || inputs.force == true
        env:
          MESSAGE: ${{ steps.gate.outputs.message }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg dashboard.md README.md cache.json data/stats.json
          if [ -f assets/font/subset.woff2 ]; then git add assets/font/subset.woff2; fi
          if git diff --cached --quiet; then
            echo "nothing staged — skipping commit"
            exit 0
          fi
          git commit -m "${MESSAGE:-chore(stats): manual refresh (no data change)}"

          # Push with retries. Two transient failures are worth surviving:
          #   - GitHub returns `remote: fatal error in commit_refs_rules` (server
          #     side, nothing to do with our commit) — seen on 2026-11-04;
          #   - someone pushed to main while the job was running.
          # Both are fixed by rebasing onto the new tip and pushing again. The
          # regenerated files are the source of truth, so conflicting hunks are
          # resolved in favour of this run (`-X theirs`).
          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::push attempt ${attempt}/4 rejected — rebasing onto origin/${branch} and retrying"
            sleep $((attempt * 5))
            git fetch --quiet origin "${branch}"
            if ! git pull --rebase --quiet -X theirs origin "${branch}"; then
              git rebase --abort || true
              echo "::error::rebase onto origin/${branch} failed — needs a human"
              exit 1
            fi
          done
          echo "::error::push still rejected after 4 attempts — GitHub kept returning a server-side error"
          exit 1
